<g transform="translate(365 850)"><rect x="-40" y="-16" width="80" height="20" fill="#fff" stroke="#2b2420" stroke-width="2"/><path d="M-46-16h92l-8-11h-76z" fill="#2b2420"/></g>
<!-- 名前 -->
<g font-size="20" fill="#2b2420" font-weight="700">
<text x="150" y="146">菓子屋横丁</text>
<text x="270" y="420" writing-mode="tb" letter-spacing="3">蔵造りの町並み</text>
<text x="488" y="190">時の鐘</text>
<text x="600" y="128">川越氷川神社</text>
<text x="690" y="300">川越城本丸御殿</text>
<text x="565" y="510">喜多院</text>
<text x="398" y="646">本川越駅</text>
<text x="415" y="858">川越駅</text>
