<path d="M330 980L340 820 360 620 380 420 390 180"/><path d="M380 420L560 440 700 470"/><path d="M390 240L560 250 720 230"/><path d="M390 180L640 150"/><path d="M560 440L590 640"/>
</g>
<g fill="none" stroke="#c9b48a" stroke-width="1.5" stroke-dasharray="2 5"><path d="M330 980L340 820 360 620 380 420 390 180"/></g>
