<g transform="translate(800 120)"><circle r="30" fill="none" stroke="#8a6d45"/><path d="M0-26l8 26h-16z" fill="#b5402f"/><path d="M0 26l8-26h-16z" fill="#8a6d45" opacity=".5"/><text y="-36" font-size="15" text-anchor="middle" fill="#2b2420">北</text></g>
<!-- 題箋 -->
<g transform="translate(560 900)"><rect width="290" height="170" fill="#fbf6ea" stroke="#8a6d45" stroke-width="2"/><rect x="6" y="6" width="278" height="158" fill="none" stroke="#8a6d45" stroke-width=".8"/>
<text x="24" y="46" font-size="30" font-weight="700" fill="#2b2420" letter-spacing="4">川越 さんぽ絵図</text>
<text x="24" y="74" font-size="13" fill="#6b5a45" letter-spacing="2">KAWAGOE ILLUSTRATED WALK</text>
<path d="M24 96h30" stroke="#b5402f" stroke-width="3.5" stroke-dasharray="1 7" stroke-linecap="round"/><text x="64" y="101" font-size="14" fill="#2b2420">おすすめの散歩道</text>
<text x="24" y="128" font-size="12" fill="#6b5a45">位置は目安の絵地図です</text>
<text x="24" y="150" font-size="12" fill="#6b5a45">見本・杜工舎 制作</text></g>
