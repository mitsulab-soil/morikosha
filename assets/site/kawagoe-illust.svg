<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif">
<defs>
<pattern id="p" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#c9b48a" opacity=".35"/></pattern>
<g id="kura"><path d="M-22 0v-22h44v22z" fill="#f3ead6" stroke="#2b2420" stroke-width="2"/><path d="M-28-22l28-16 28 16z" fill="#2b2420"/><rect x="-6" y="-14" width="12" height="14" fill="#2b2420"/></g>
<g id="tree"><circle r="11" fill="#7d9a62"/><circle cx="7" cy="-6" r="8" fill="#93b073"/><rect x="-1.5" y="8" width="3" height="8" fill="#6b4a32"/></g>
</defs>
<rect width="900" height="1120" fill="#f4ecd8"/><rect width="900" height="1120" fill="url(#p)"/>
<rect x="18" y="18" width="864" height="1084" fill="none" stroke="#8a6d45" stroke-width="2"/><rect x="26" y="26" width="848" height="1068" fill="none" stroke="#8a6d45" stroke-width=".8"/>
