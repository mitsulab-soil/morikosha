<path d="M40 70C180 40 300 60 420 40S700 30 860 70" fill="none" stroke="#9cc0c9" stroke-width="26" stroke-linecap="round" opacity=".7"/>
<text x="120" y="70" font-size="16" fill="#4f7f8a" letter-spacing="4">新河岸川</text>
