<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>土地の時間を読む散歩 — 川越（見本）｜杜工舎</title>
<meta name="description" content="同じ道を、いま・むかし・その間から。川越で、古い空中写真といまを重ね、歩きながら音声で解説を聞く見本です。">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap">
<style>
:root{--ink:#231d19;--paper:#efe4c8;--paper2:#f8f1df;--red:#a8382a;--gold:#7a5f2c;--line:#d6c7a2}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:1;min-height:48vh}
#map{position:absolute;inset:0}
/* 古い写真はセピアに寄せ、地図の縁を暗くして額に入れたように */
.old .leaflet-tile{filter:sepia(.55) contrast(1.05) brightness(.97)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:500;box-shadow:inset 0 0 80px 10px rgba(35,29,25,.45)}
.title{position:absolute;z-index:600;left:12px;top:12px;background:var(--paper2);border:1px solid var(--gold);padding:10px 14px 10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:calc(100% - 80px)}
.title::before{content:"";position:absolute;inset:3px;border:.5px solid var(--gold);pointer-events:none}
.title h1{font-size:18px;font-weight:800;letter-spacing:.14em;line-height:1.3}
.title small{display:block;font-size:11px;color:var(--gold);letter-spacing:.12em;font-weight:500}
.seal{flex:none;width:34px;height:34px;background:var(--red);color:var(--paper2);display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1.05;text-align:center;border-radius:3px;transform:rotate(-4deg)}
.home{position:absolute;z-index:600;right:12px;bottom:14px;font-size:12px;color:var(--paper2);background:rgba(35,29,25,.7);padding:6px 10px;border-radius:99px;text-decoration:none;letter-spacing:.08em}
/* 年代の大きな字 */
.eraBig{position:absolute;z-index:550;left:0;right:0;bottom:22%;text-align:center;pointer-events:none;color:var(--paper2);text-shadow:0 2px 14px rgba(0,0,0,.6);transition:opacity .5s}
.eraBig b{display:block;font-size:clamp(34px,11vw,64px);font-weight:800;letter-spacing:.18em}
.eraBig span{font-size:13px;letter-spacing:.3em}
.panel{position:relative;background:var(--paper2);padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:52vh;overflow:auto;border-top:3px double var(--gold);box-shadow:0 -10px 24px rgba(0,0,0,.18)}
.grip{width:44px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
/* 時間のつまみ：朱の菱形 */
.era{position:relative;margin:6px 6px 0}
.era input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
.era input::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#6b5640,var(--gold) 50%,var(--red));border-radius:2px}
.era input::-moz-range-track{height:3px;background:linear-gradient(90deg,#6b5640,var(--gold) 50%,var(--red))}
.era input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-10px;background:var(--red);border:3px solid var(--paper2);transform:rotate(45deg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.era input::-moz-range-thumb{width:18px;height:18px;background:var(--red);border:3px solid var(--paper2);border-radius:0;transform:rotate(45deg)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--gold);margin:0 0 12px;letter-spacing:.06em}
.ticks span{position:relative;padding-top:6px}
.ticks span::before{content:"";position:absolute;top:-6px;left:50%;width:1px;height:8px;background:var(--gold)}
.ticks span:first-child::before{left:6px}.ticks span:last-child::before{left:auto;right:6px}
.ticks b{color:var(--red);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-bottom:10px}
button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button svg{width:15px;height:15px;flex:none}
button.on{background:var(--ink);color:var(--paper2)}
button.red{border-color:var(--red);background:var(--red);color:#fff}
button.red.on{background:#7d2519}
#status{font-size:12px;color:#6b5640;margin-bottom:12px;min-height:1.4em;padding-left:10px;border-left:2px solid var(--red)}
ol{list-style:none;padding:0;display:grid;gap:10px}
li{position:relative;border:1px solid var(--line);background:#fffaf0;padding:14px 14px 12px 58px;transition:box-shadow .3s,border-color .3s}
li.near{border-color:var(--red);box-shadow:0 0 0 3px rgba(168,56,42,.18)}
li .no{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper2);display:grid;place-items:center;font-size:16px;font-weight:800}
li.near .no{background:var(--red)}
li h2{font-size:17px;font-weight:800;letter-spacing:.06em;display:flex;align-items:baseline;gap:8px}
li h2 span{margin-left:auto;font-size:12px;color:var(--gold);font-weight:500}
li p{font-size:14px;line-height:1.85;margin-top:6px}
li .find{font-size:13px;color:var(--red);margin-top:8px;padding:6px 10px;background:rgba(168,56,42,.06);border-left:2px solid var(--red)}
li .find::before{content:"さがす　";font-weight:800}
li button{margin-top:10px;min-height:44px;padding:8px 16px;font-size:13px}
button{min-height:44px;white-space:nowrap}
.btns button{padding:10px 8px;font-size:12.5px;letter-spacing:.02em}
li.speaking{border-color:var(--gold);box-shadow:0 0 0 3px rgba(122,95,44,.2)}
.note{font-size:11px;color:#6b5a45;line-height:1.7;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.leaflet-container{background:#d9c9a3;font-family:inherit}
.leaflet-control-attribution{font-size:10px;background:rgba(248,241,223,.85)!important}
.pin{width:34px;height:34px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;background:var(--red);border:2px solid var(--paper2);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.pin b{transform:rotate(45deg)}
.pin.near{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,56,42,.7)}100%{box-shadow:0 0 0 16px rgba(168,56,42,0)}}
.me{width:18px;height:18px;border-radius:50%;background:#2f6fd6;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,111,214,.25)}
.era input:focus-visible{outline:2px solid var(--red);outline-offset:4px}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.panel.min{max-height:150px}
.grip{display:block;border:0;padding:0;cursor:pointer;min-height:0!important;height:20px;width:64px;background:linear-gradient(var(--line),var(--line)) center/44px 4px no-repeat;border-radius:0}
@media (min-width:900px){body{flex-direction:row}.stage{flex:1}.panel{width:420px;max-height:none;height:100%;border-top:0;border-left:3px double var(--gold)}.grip{display:none}}
</style>
</head>
<body>
<div class="stage">
<div id="map" role="application" aria-label="川越の地図。時間をずらすと、古い空中写真に切り替わります"></div>
<div class="title"><span class="seal" aria-hidden="true">杜工<br>舎印</span><div><h1>土地の時間を読む散歩</h1><small id="yado">川越・見本</small></div></div>
<p class="eraBig" id="eraBig" aria-hidden="true"><b>いま</b><span>NOW</span></p>
<a class="home" href="/#time">杜工舎へ</a>
</div>
<section class="panel">
  <button class="grip" id="grip" aria-label="案内をたたむ・ひらく" aria-expanded="true"></button>
  <div class="era"><label for="t" class="sr" style="position:absolute;left:-9999px">時間をずらす</label><input id="t" type="range" min="0" max="300" value="300" step="1" aria-valuetext="いま"></div>
  <div class="ticks"><span data-v="0">1960年代</span><span data-v="150">1970年代</span><span data-v="300">いま</span></div>
  <div class="btns">
    <button id="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>うつろい</button>
    <button id="gps" class="red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>歩きながら聞く</button>
    <button id="stop" aria-label="音声を止める"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>止める</button>
  </div>
  <p id="status" aria-live="polite">地図の上の時間をずらすと、同じ場所の昔の空中写真に変わります。</p>
  <ol id="list"></ol>
  <p class="note">空中写真・地図：国土地理院（地理院タイル。1961〜1969年・1974〜1978年の空中写真、全国最新写真、淡色地図）を加工せずに表示。解説は一般に伝えられている内容をもとにした見本で、年代などは「〜と伝わる」ものを含みます。位置情報は端末の中だけで使い、送信しません。<br>見本・杜工舎 制作</p>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 宿ごとの差し替え：?yado=宿の名前 で、題字の下が「〇〇から歩く」になる（宿に渡すQRはこの形）
const yado=new URLSearchParams(location.search).get('yado');
if(yado){document.getElementById('yado').textContent=yado.slice(0,30)+'から歩く・見本';document.title=yado.slice(0,30)+'から歩く 土地の時間を読む散歩'}
const SPOTS=[
 {n:"菓子屋横丁",la:35.92509,lo:139.48080,
  t:"明治のはじめに菓子づくりが始まり、昭和の初めには多くの菓子屋が並んだと伝わる路地です。関東大震災のあと、東京に代わって菓子を作り届けたとも言われます。",
  f:"石畳の細い路地の、いちばん古そうな看板を探してみましょう。"},
 {n:"蔵造りの町並み",la:35.92354,lo:139.48293,
  t:"明治二十六年の大火で、まちの多くが焼けました。商人たちは、燃えにくい土の壁と黒い漆喰の蔵造りで店を建て直します。いま見える重たい屋根と厚い扉は、火に負けないまちをつくった跡です。",
  f:"店の二階の、分厚い観音開きの扉を探してみましょう。"},
 {n:"時の鐘",la:35.92348,lo:139.48334,
  t:"江戸のはじめ、寛永のころに川越の城主が建てたのが始まりと伝わる鐘つき堂です。いまの鐘楼は、明治二十六年の大火のあとに建て直されたもの。いまも一日に四回、時を知らせています。",
  f:"鐘の音が鳴る時刻を、案内の板から探してみましょう。"},
 {n:"川越氷川神社",la:35.92714,lo:139.48878,
  t:"およそ千五百年前にまつられたと伝わる、川越の氏神です。秋の川越まつりは、この神社の祭礼として始まりました。",
  f:"境内の大きな鳥居の高さを、見上げて確かめてみましょう。"},
 {n:"川越城本丸御殿",la:35.92450,lo:139.49150,
  t:"江戸の終わり、嘉永元年に建てられた御殿です。本丸御殿が残る城は、全国でもごくわずか。大きな唐破風の玄関に、川越が城下町だったころの姿が残っています。",
  f:"玄関の屋根の、ゆるやかに反った曲線を探してみましょう。"},
 {n:"喜多院",la:35.91782,lo:139.48891,
  t:"天海僧正ゆかりの寺です。寛永十五年の川越の大火で焼けたあと、江戸城の御殿の一部がここへ移されたと伝わり、三代将軍家光が生まれた部屋とされる建物が残ります。境内の五百羅漢は、一体ずつ表情が違います。",
  f:"五百羅漢の中から、笑っている顔を探してみましょう。"}
];
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([35.9225,139.4860],16);map.fitBounds(SPOTS.map(s=>[s.la,s.lo]),{padding:[30,30]});
L.control.zoom({position:'topright'}).addTo(map);
const gsi='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>';
const now=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:18,attribution:gsi}).addTo(map);
let tileErr=0;const onErr=()=>{if(++tileErr===4)setStatus('地図の写真を読み込めませんでした。電波のよい場所で開き直してください。解説は「解説を聞く」で聞けます。')};
const pale=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,opacity:.22}).addTo(map);
const y70=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/gazo1/{z}/{x}/{y}.jpg',{maxNativeZoom:17,maxZoom:18,opacity:0}).addTo(map);
const y60=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort_old10/{z}/{x}/{y}.png',{maxNativeZoom:17,maxZoom:18,opacity:0}).addTo(map);
const eb=document.getElementById('eraBig');let ebT;
now.on('tileerror',onErr);
const t=document.getElementById('t'),ticks=[...document.querySelectorAll('.ticks span')];
function setEra(v){
  // 0=1960年代 150=1970年代 300=いま。間は重ねて、うつろいとして見せる
  y60.setOpacity(v<150?1-v/150:0);
  y70.setOpacity(v<=150?1:Math.max(0,1-(v-150)/150));
  pale.setOpacity(v>=300?.22:0);
  const lab=v<75?'1960年代':v<225?'1970年代':'いま';
  document.getElementById('map').classList.toggle('old',v<300);
  const big={'1960年代':['昭和三十年代','1961–1969'],'1970年代':['昭和五十年ごろ','1974–1978'],'いま':['いま','NOW']}[lab];
  eb.innerHTML='<b>'+big[0]+'</b><span>'+big[1]+'</span>';clearTimeout(ebT);eb.style.opacity=1;ebT=setTimeout(()=>eb.style.opacity=0,1600);
  t.setAttribute('aria-valuetext',lab);
  ticks.forEach(s=>s.innerHTML=s.textContent===lab?'<b>'+lab+'</b>':s.textContent);
}
t.addEventListener('input',()=>setEra(+t.value));setEra(300);
document.getElementById('grip').onclick=()=>{const p=document.querySelector('.panel'),m=p.classList.toggle('min');document.getElementById('grip').setAttribute('aria-expanded',String(!m));setTimeout(()=>map.invalidateSize(),50)};
let anim;document.getElementById('play').onclick=ev=>{const e={target:ev.currentTarget};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){t.value=0;setEra(0);return}
  if(anim){cancelAnimationFrame(anim);anim=null;e.target.classList.remove('on');return}
  e.target.classList.add('on');let v=0,t0=performance.now();
  const step=ts=>{v=Math.min(300,(ts-t0)/20);t.value=v;setEra(v);if(v<300)anim=requestAnimationFrame(step);else{anim=null;e.target.classList.remove('on')}};
  anim=requestAnimationFrame(step);
};
// 名所の印と一覧
const list=document.getElementById('list'),items=[],pins=[];
L.polyline(SPOTS.map(s=>[s.la,s.lo]),{color:'#a8382a',weight:4,dashArray:'2 10',lineCap:'round',opacity:.9}).addTo(map);
SPOTS.forEach((s,i)=>{
  pins[i]=L.marker([s.la,s.lo],{icon:L.divIcon({className:'',html:'<div class="pin"><b>'+'一二三四五六'[i]+'</b></div>',iconSize:[34,34],iconAnchor:[17,34]}),title:s.n}).addTo(map).on('click',()=>{items[i].scrollIntoView({behavior:'smooth',block:'nearest'});speak(i)});
  const li=document.createElement('li');
  li.innerHTML='<span class="no">'+'一二三四五六'[i]+'</span><h2>'+s.n+'<span></span></h2><p>'+s.t+'</p><p class="find">'+s.f+'</p><button type="button">▶ 解説を聞く</button>';
  li.querySelector('button').onclick=()=>speak(i);
  list.appendChild(li);items.push(li);
});
// 音声（端末の読み上げ）
let voice;function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('ja'));voice=v.find(x=>/Kyoko|O-ren|Google/.test(x.name))||v[0];}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(i){
  if(!('speechSynthesis' in window)){setStatus('この端末では読み上げが使えません。');return}
  speechSynthesis.cancel();const s=SPOTS[i];
  const u=new SpeechSynthesisUtterance(s.n+'。'+s.t+'　'+s.f);u.lang='ja-JP';u.rate=.95;if(voice)u.voice=voice;
  items.forEach(x=>x.classList.remove('speaking'));items[i].classList.add('speaking');let cur=u;speak.cur=u;u.onend=()=>{if(speak.cur!==cur)return;items[i].classList.remove('speaking');setStatus('「'+s.n+'」の解説が終わりました。')};
  speechSynthesis.speak(u);setStatus('「'+s.n+'」の解説を読み上げています。');
}
document.getElementById('stop').onclick=()=>{items.forEach(x=>x.classList.remove('speaking'));if('speechSynthesis' in window)speechSynthesis.cancel();setStatus('音声を止めました。')};
function setStatus(m){document.getElementById('status').textContent=m}
// GPS：近づいた名所の解説を自動で
const R=30,heard=new Set();let me,watch;
function dist(a,b,c,d){const r=6371e3,p=Math.PI/180,x=(d-b)*p*Math.cos((a+c)/2*p),y=(c-a)*p;return Math.hypot(x,y)*r}
document.getElementById('gps').onclick=ev=>{const e={target:ev.currentTarget};
  if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;e.target.classList.remove('on');setStatus('GPS を止めました。');return}
  if(!navigator.geolocation){setStatus('この端末では位置情報が使えません。');return}
  if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''));// iPhone で読み上げを使えるようにする
  e.target.classList.add('on');setStatus('位置を探しています…');
  watch=navigator.geolocation.watchPosition(p=>{
    const {latitude:la,longitude:lo,accuracy:ac}=p.coords;
    if(!me)me=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);else me.setLatLng([la,lo]);
    let best=-1,bd=1e9;
    SPOTS.forEach((s,i)=>{const d=dist(la,lo,s.la,s.lo);items[i].querySelector('h2 span').textContent=d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';items[i].classList.toggle('near',d<R);pins[i].getElement()?.firstChild.classList.toggle('near',d<R);if(d<bd){bd=d;best=i}});
    if(ac>60){setStatus('位置の精度が低いため（±'+Math.round(ac)+' m）、自動の解説は待っています。');return}
    if(bd<R&&!heard.has(best)){heard.add(best);speak(best);if(navigator.vibrate)navigator.vibrate(200);items[best].scrollIntoView({behavior:'smooth',block:'nearest'})}
    else if(bd>=R)setStatus('いちばん近いのは「'+SPOTS[best].n+'」、約'+Math.round(bd)+' m（精度 ±'+Math.round(ac)+' m）。近づくと解説が流れます。');
  },err=>{setStatus('位置情報を使えませんでした（'+err.message+'）。一覧の「解説を聞く」で聞けます。');e.target.classList.remove('on');watch=null},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
};
</script>
</body>
</html>
