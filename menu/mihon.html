<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>多言語メニューの完成見本・5案｜杜工舎</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e6 url(../assets/site/washi-photo.jpg);color:#263a32;font:14px/1.8 "Hiragino Kaku Gothic ProN",sans-serif}header,main{max-width:980px;margin:auto;padding:24px}a{color:inherit}h1{font:500 32px/1.7 "Hiragino Mincho ProN",serif}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}nav a{text-decoration:none;text-align:center;padding:12px 4px;border:1px solid #bac1b3}nav a[aria-current]{background:#263a32;color:#fff}nav b{display:block;font:24px "Hiragino Mincho ProN",serif}nav span{display:block;font-size:12px}.label{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;margin:26px 0}.download{padding:12px 18px;background:#263a32;color:white;text-decoration:none}figure{margin:0 auto;max-width:794px}img{width:100%;height:auto;display:block;box-shadow:0 14px 50px #24332120}@media(max-width:600px){header,main{padding:20px}h1{font-size:26px}nav{gap:6px}nav span{font-size:10px}.label{gap:12px}}</style></head><body><header><a href="../menu.html">← 多言語メニュー作成へ</a><h1>お店の空気を、一枚に。</h1><p>日本語と英語の完成見本です。5案それぞれのPDFをダウンロードできます。店舗・品名・価格は架空の見本です。</p><nav aria-label="メニューデザインを選ぶ"><a href="#ai" data-n="1"><b>藍</b><span>和食</span></a><a href="#shu" data-n="2"><b>朱</b><span>居酒屋</span></a><a href="#to" data-n="3"><b>燈</b><span>ラーメン</span></a><a href="#wata" data-n="4"><b>綿</b><span>カフェ</span></a><a href="#gin" data-n="5"><b>銀</b><span>洋食</span></a></nav></header><main><div class="label"><h2 id="name"></h2><a id="download" class="download" download>この案のPDFをダウンロード ↗</a></div><figure><a id="large" target="_blank" rel="noopener"><img id="sheet" width="1588" height="2244" alt=""></a></figure></main><script>const designs=[{"no": 1, "key": "ai", "name": "藍", "fit": "和食・そば・定食"}, {"no": 2, "key": "shu", "name": "朱", "fit": "居酒屋・焼き鳥・炉端"}, {"no": 3, "key": "to", "name": "燈", "fit": "ラーメン・中華・食堂"}, {"no": 4, "key": "wata", "name": "綿", "fit": "カフェ・甘味・パン"}, {"no": 5, "key": "gin", "name": "銀", "fit": "洋食・ビストロ・ホテルの食堂"}];function update(){let d=designs.find(d=>('#'+d.key)===location.hash)||designs[4];document.querySelectorAll('nav a').forEach(a=>{if(+a.dataset.n===d.no)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});document.getElementById('sheet').src='../assets/menu/final-'+d.no+'.jpg';document.getElementById('sheet').alt='完成見本「'+d.name+'」の全体';document.getElementById('large').href='../assets/menu/final-'+d.no+'.jpg';document.getElementById('name').textContent=d.name+' / '+d.fit;document.getElementById('download').href='final-'+d.no+'.pdf'}addEventListener('hashchange',update);update();</script></body></html>
